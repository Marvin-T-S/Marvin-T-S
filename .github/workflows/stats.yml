name: Update Language Statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'stats/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Completely remove the stats folder from Git and disk to start fresh
      - name: Clean stats directory
        run: |
          git rm -r --ignore-unmatch stats || true

      - name: Generate statistics
        uses: StefVuck/Github-Language-Stats@v1.2.0
        with:
          github_token: ${{ secrets.STATS_TOKEN }}
          visualization_types: 'leaderboard bar pie donut'
          output_path: 'stats'
          exclude_languages: 'HTML,CSS'
          dark_mode: 'true'
