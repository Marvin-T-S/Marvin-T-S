name: Update Language Statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'stats/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Save the current stats so the action starts with a clean Git tree.
      - name: Backup current stats
        run: |
          rm -rf /tmp/old-stats
          if [ -d stats ]; then
            cp -a stats /tmp/old-stats
          fi

      # Generate the new statistics.
      - name: Generate statistics
        uses: StefVuck/Github-Language-Stats@v1.2.0
        with:
          github_token: ${{ secrets.STATS_TOKEN }}
          visualization_types: 'leaderboard bar pie donut'
          output_path: 'stats'
          exclude_languages: 'HTML,CSS'
          dark_mode: 'true'

      # At this point the action has generated its files.
      # Remove anything that was not generated this time.
      - name: Remove stale statistics
        run: |
          git fetch origin main

          # Remove all existing tracked/untracked stats files.
          git rm -rf --ignore-unmatch stats
          rm -rf stats

          # Restore the newly generated statistics.
          mkdir -p stats
          # The action's generated files are already gone if they were
          # written into stats, so this approach is not suitable if the
          # action commits/pushes internally.

