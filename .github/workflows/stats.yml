name: Update Language Statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'stats/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Completely remove the previous generated statistics.
      - name: Clear stats
        run: |
          rm -rf stats
          mkdir -p stats

      # Your fork should ONLY generate the files.
      # It must NOT pull, commit or push.
      - name: Generate statistics
        uses: StefVuck/Github-Language-Stats@v1.2.0
        with:
          github_token: ${{ secrets.STATS_TOKEN }}
          visualization_types: 'leaderboard bar pie donut'
          output_path: 'stats'
          exclude_languages: 'HTML,CSS'
          dark_mode: 'true'

      # Commit everything, including deletions.
      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A stats

          if git diff --cached --quiet; then
            echo "No changes to statistics."
            exit 0
          fi

          git commit -m "Update language statistics"
          git push origin HEAD:main
